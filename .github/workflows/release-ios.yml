name: Release iOS

# Apple Developer 계정·인증서·App Store Connect 설정이 끝나기 전까지는 수동 실행 전용 골격이다.
# eas.json에 iOS 프로필(submit.production.ios 포함)을 추가한 뒤 태그 트리거(ios-v*)를 연다.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: release-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - run: eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive
