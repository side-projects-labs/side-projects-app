name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # master 대상 PR의 필수 체크(브랜치 보호): 타입 체크 + lint + 테스트 + 리뷰 게이트. job 이름 `check`를 바꾸면 보호 규칙도 함께 바꿔야 한다.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test
      # 리뷰 게이트: master 대상 PR은 최신 커밋의 리뷰 코멘트에 치명·중요 지적이 없어야 통과한다(docs/review-gate.md).
      # 리뷰를 남긴 뒤에는 같은 실행을 다시 돌려 평가한다(.github/scripts/post-review.sh). 새 이벤트로 별도 실행을 만들면
      # 같은 이름의 이전 실패 체크가 남아 병합 판정이 풀리지 않는다.
      - name: Review gate
        if: github.event_name != 'push' && github.event.pull_request.base.ref == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/review-gate.sh

  # 참고용 점검. 의존성 호환 경고는 병합 조건이 아니라서 별도 job으로 분리한다.
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
