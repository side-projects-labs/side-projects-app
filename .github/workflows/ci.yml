name: CI

on:
  pull_request:
  # 리뷰 코멘트가 남거나 수정되면 게이트를 다시 평가한다(새 필수 체크 없이 `check`를 갱신).
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # master 대상 PR의 필수 체크(브랜치 보호): 타입 체크 + lint + 테스트 + 리뷰 게이트. job 이름 `check`를 바꾸면 보호 규칙도 함께 바꿔야 한다.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test
      # 리뷰 게이트: master 대상 PR은 최신 커밋의 리뷰 코멘트에 치명·중요 지적이 없어야 통과한다(docs/review-gate.md).
      - name: Review gate
        if: github.event_name != 'push' && github.event.pull_request.base.ref == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/review-gate.sh

  # 참고용 점검. 의존성 호환 경고는 병합 조건이 아니라서 별도 job으로 분리한다.
  doctor:
    # 리뷰 코멘트로 재실행될 때는 건너뛴다(게이트만 다시 평가하면 된다).
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
