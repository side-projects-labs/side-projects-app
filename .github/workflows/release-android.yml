name: Release Android

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Play Console 내부 테스트로 제출 (production만)
        type: boolean
        default: false

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROFILE: ${{ github.event_name == 'push' && 'production' || inputs.profile }}
      SUBMIT: ${{ github.event_name == 'push' || (inputs.profile == 'production' && inputs.submit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - name: Build (and submit)
        run: |
          if [ "$SUBMIT" = "true" ]; then
            eas build --platform android --profile "$PROFILE" --non-interactive --auto-submit
          else
            eas build --platform android --profile "$PROFILE" --non-interactive
          fi
